# 前端静态资源的 nginx 规则。
#
# 合入 /etc/nginx/sites-enabled/xiaox.art 的 HTTPS server 块，替换原来那个
# location /。TLS、/api/、/tarot-images/、/ws 四块保持原样不动。
# 全文对照见 AWS_EC2_DEPLOY.md 附录 A。
#
# 解决 2026-09-23 的白屏事故，两条根因：
#   1. index.html 没有 Cache-Control，浏览器按启发式缓存（约为文件年龄的 10%），
#      一份活了 70 天的 HTML 能在浏览器里再赖上一周，期间完全不来问服务器；
#   2. 已被新构建删掉的 /assets/index-<hash>.js 被 try_files 兜回 index.html，
#      浏览器拿到一坨 HTML 当 ES module 执行，当场白屏 —— 而且这个错误响应带着
#      index.html 的 ETag，还能一直通过 304 校验继续复用。
#
# 上线顺序（详见 AWS_EC2_DEPLOY.md「前端发布」）：
#   先跑 deploy/publish-frontend.sh 生成 published/，再换这份配置、nginx -t、reload。
#   反过来会让 root 指向一个还不存在的目录。

# HTML 一律「用之前必须回服务器校验」。no-cache 不是不存，是不许不问就用。
location = /index.html {
    root /home/ubuntu/tarot-astro/frontend/published;
    try_files $uri =404;
    add_header Cache-Control "no-cache" always;
}

location / {
    root /home/ubuntu/tarot-astro/frontend/published;
    index index.html;
    # React 路由必须配置这个，否则刷新页面会 404
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache" always;
}

# 带内容哈希的构建产物，和 public/assets/ 下不带哈希的固定文件（icon.webp、
# avatar-*.webp、table.webp）混在同一个目录里，所以整目录只能用 no-cache——
# 存得下，但用之前必须校验。不能对这个目录设 immutable。
# ^~ 锁死这个前缀，之后即使有人加了正则 location 也抢不走 /assets/。
location ^~ /assets/ {
    root /home/ubuntu/tarot-astro/frontend/published;
    try_files $uri @missing_asset;
    add_header Cache-Control "no-cache" always;
}

# 缺失的资源绝不回退 HTML。
# 历史主入口交给恢复脚本，其余一律 404 + no-store（不许把这次失败也缓存下来）。
# 用正则匹配而不是枚举哈希：access log 只留 14 天，更早的入口文件名已经查不到了，
# 清单永远补不全。
location @missing_asset {
    if ($uri ~ "^/assets/index-[A-Za-z0-9_-]+\.js$") {
        rewrite ^ /__frontend-recovery/legacy-entry-recovery.js last;
    }
    add_header Cache-Control "no-store" always;
    return 404;
}

# 恢复脚本本体。放在 published/ 之外，发布时不会被换掉。
# etag off + if_modified_since off：旧浏览器会带着当年那个错误响应的 ETag /
# If-Modified-Since 来问，必须让它拿到 200 的 JavaScript，不能回 304。
location = /__frontend-recovery/legacy-entry-recovery.js {
    internal;
    alias /home/ubuntu/tarot-astro/frontend/recovery/legacy-entry-recovery.js;
    types { }
    default_type application/javascript;
    etag off;
    if_modified_since off;
    add_header Cache-Control "no-store" always;
}
